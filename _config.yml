title: "Zheng Lab for Data Science"
description: "A Knowledge Ecosystem Builder"
url: "https://zhengnetlab.github.io"
baseurl: "/zheng-lab"
lang: en
timezone: Europe/Berlin

# Build
markdown: kramdown
theme: null
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"

# Author profile
author:
  name: "Xin Zheng"
  avatar: "/assets/img/avatar.png"
  bio: "A Knowledge Ecosystem Builder"
  location: "Munich, Germany"
  links:
    - label: "GitHub"
      url: "https://github.com/ZhengNetLab"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/your-handle"
    - label: "YouTube"
      url: "https://www.youtube.com/@zhenglab"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
  - scope:
      path: ""
      type: "projects"
    values:
      layout: single
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Navigation
include: ["_pages"]
