<nav class="site-nav" role="navigation" aria-label="Main navigation">
  <div class="container">
    <a class="nav-logo" href="{{ '/' | relative_url }}">

      <span class="nav-logo-text">Zheng<span>Lab</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} class="active"{% endif %}>Blog</a></li>

          {% assign area_url = '/projects/' | append: area.slug | append: '/' %}

          {% endfor %}
        </ul>
      </li>
      <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a></li>
